apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track-checkout

resources:
  - ../../base

components:
  - ../../componentes/postgres-efemero
  - ../../componentes/nodeport

patches:
  - path: hpa-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-track-checkout-config
    literals:
      - ST_CHK_DB_URL=jdbc:postgresql://service-track-checkout-postgres:5432/st_chk
      - ST_CHK_DB_USER=st_chk_user
      - ST_CHK_DB_PASSWORD=st_chk_local
      - URL_SERVICE_ORDER_GET=http://service-track-ordens.service-track-ordens.svc.cluster.local/ordens
      - MERCADO_PAGO_VERIFY_SIGNATURE=false
      - OTEL_JAVAAGENT_ENABLED=false
