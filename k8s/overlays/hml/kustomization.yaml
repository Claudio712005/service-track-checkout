apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track-checkout

resources:
  - ../../base


images:
  - name: servicetrack-checkout
    newName: 734564927706.dkr.ecr.us-east-1.amazonaws.com/servicetrack-hml-checkout
    newTag: 4424d00afce35246ac79f03d20df9e79f738af7f

patches:
  - path: hpa-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-track-checkout-config
    literals:
      - ST_CHK_DB_POOL_MAX=10
      - ST_CHK_DB_POOL_MIN=2
      - URL_SERVICE_ORDER_GET=http://service-track-ordens.service-track-ordens.svc.cluster.local/ordens
      - OTEL_JAVAAGENT_ENABLED=false
