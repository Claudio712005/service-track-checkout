spring:
  application:
    name: service-track-checkout
  datasource:
    url: ${ST_CHK_DB_URL}
    username: ${ST_CHK_DB_USER}
    password: ${ST_CHK_DB_PASSWORD}
    hikari:
      pool-name: st-chk-pool
      maximum-pool-size: ${ST_CHK_DB_POOL_MAX:10}
      minimum-idle: ${ST_CHK_DB_POOL_MIN:2}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  webhook-tolerance-window: ${MERCADO_PAGO_WEBHOOK_TOLERANCE:5m}
  verify-webhook-signature: ${MERCADO_PAGO_VERIFY_SIGNATURE:true}

clients:
  integrations:
    PIX_PAYMENT_CREATE:
      url: ${URL_PIX_PAYMENT_CREATE:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_PIX_PAYMENT_CREATE:15000}
      retry: ${RETRY_PIX_PAYMENT_CREATE:2}
    BOLETO_PAYMENT_CREATE:
      url: ${URL_BOLETO_PAYMENT_CREATE:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_BOLETO_PAYMENT_CREATE:15000}
      retry: ${RETRY_BOLETO_PAYMENT_CREATE:2}
    CARD_PAYMENT_CREATE:
      url: ${URL_CARD_PAYMENT_CREATE:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_CARD_PAYMENT_CREATE:20000}
      retry: ${RETRY_CARD_PAYMENT_CREATE:0}
    PAYMENT_GET:
      url: ${URL_PAYMENT_GET:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_PAYMENT_GET:10000}
      retry: ${RETRY_PAYMENT_GET:3}
    PAYMENT_CANCEL:
      url: ${URL_PAYMENT_CANCEL:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_PAYMENT_CANCEL:15000}
      retry: ${RETRY_PAYMENT_CANCEL:2}
    SERVICE_ORDER_GET:
      url: ${URL_SERVICE_ORDER_GET:http://localhost:8082/ordens}
      timeout: ${TIMEOUT_SERVICE_ORDER_GET:5000}
      retry: ${RETRY_SERVICE_ORDER_GET:2}
    PAYMENT_REFUND:
      url: ${URL_PAYMENT_REFUND:https://api.mercadopago.com/v1/payments}
      timeout: ${TIMEOUT_PAYMENT_REFUND:15000}
      retry: ${RETRY_PAYMENT_REFUND:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
  tracing:
    sampling:
      probability: ${ST_CHK_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      export:
        enabled: ${ST_CHK_OTLP_ENABLED:false}
    metrics:
      export:
        enabled: ${ST_CHK_OTLP_ENABLED:false}

logging:
  structured:
    format:
      console: ${ST_CHK_LOG_FORMAT:logstash}
  pattern:
    correlation: "[${spring.application.name:service-track-checkout},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{requestId:-}] "
